<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Ryan's Computer</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>

<div class="desktop">

    <!-- DESKTOP ICONS -->

    <div class="desktopIcons">


        <div class="desktopIcon" id="archiveIcon" ondblclick="openArchive()">

            <div class="iconImage">📁</div>

            <span>Ryan's Archive</span>

        </div>


        <div class="desktopIcon" id="minecraftIcon">

            <div class="iconImage">🎮</div>

            <span>Minecraft</span>

        </div>


        <div class="desktopIcon" id="discordIcon">

            <div class="iconImage">💬</div>

            <span>Discord</span>

        </div>


        <div class="desktopIcon" id="internetIcon">

            <div class="iconImage">🌐</div>

            <span>Internet</span>

        </div>


        <div class="desktopIcon" id="recycleIcon">

            <div class="iconImage">🗑️</div>

            <span>Recycle Bin</span>

        </div>


    </div>

    <!-- START MENU -->

    <div class="startMenu hidden" id="startMenu">

        <div class="startHeader">
            Ryan's Computer
        </div>

        <div class="startItem" onclick="openArchive()">
            📁 Ryan's Archive
        </div>

        <div class="startItem">
            📄 Documents
        </div>

        <div class="startItem">
            🎮 Programs
        </div>

        <hr>

        <div class="startItem">
            ⚙ Settings
        </div>

        <div class="startItem">
            ⏻ Shut Down
        </div>

    </div>

    <!-- TASKBAR -->

    <div class="taskbar">


        <div class="startButton" onclick="toggleStartMenu(event)">

            ⊞ Start

        </div>


        <div class="taskbarSpacer"></div>


        <div class="clock" id="desktopClock">

            --:--

        </div>


    </div>

</div>


<script src="../script.js"></script>

</body>

</html>
