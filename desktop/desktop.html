<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Ryan's Computer</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>

<div class="desktop">

    <!-- DESKTOP ICONS -->

    <div class="desktopIcons">


        <div class="desktopIcon" ondblclick="openArchive()">

            <div class="iconImage">📁</div>

            <span>Ryan's Archive</span>

        </div>


        <div class="desktopIcon">

            <div class="iconImage">🎮</div>

            <span>Minecraft</span>

        </div>


        <div class="desktopIcon">

            <div class="iconImage">💬</div>

            <span>Discord</span>

        </div>


        <div class="desktopIcon">

            <div class="iconImage">🌐</div>

            <span>Internet</span>

        </div>


        <div class="desktopIcon">

            <div class="iconImage">🗑️</div>

            <span>Recycle Bin</span>

        </div>


    </div>


    <!-- TASKBAR -->

    <div class="taskbar">


        <div class="startButton">

            ⊞ Start

        </div>


        <div class="taskbarSpacer"></div>


        <div class="clock" id="desktopClock">

            --:--

        </div>


    </div>

</div>


<script src="../script.js"></script>

</body>

</html>
